name: Generate SkillSwap iOS Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-ios:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate iOS platform files
        run: flutter create --platforms=ios --org com.mdjahangir424 --project-name skillswap .

      - name: Commit iOS project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios
          if git diff --cached --quiet; then
            echo "No iOS project changes to commit."
          else
            git commit -m "Generate SkillSwap iOS project files"
            git push
          fi
